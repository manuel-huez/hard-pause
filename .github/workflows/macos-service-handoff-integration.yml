# Feature branches can run this before the workflow reaches the default branch:
# push a change to this workflow, the fixture script, or macOS sources. Once on
# the default branch, use Actions -> macOS Service Handoff Integration -> Run workflow.
name: macOS Service Handoff Integration
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - master
    paths:
      - .github/workflows/macos-service-handoff-integration.yml
      - scripts/test-macos-service-handoff-integration.sh
      - macos/**
      - core/**
permissions:
  contents: read
concurrency:
  group: macos-service-handoff
  cancel-in-progress: false
jobs:
  native-handoff:
    if: github.repository == 'manuel-huez/hard-pause'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run isolated native service handoff fixture
        shell: bash
        run: ./scripts/test-macos-service-handoff-integration.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macos-service-handoff
          path: build/handoff-artifacts
          if-no-files-found: error
          retention-days: 7

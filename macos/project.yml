name: HardPause
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ZBX6C7BJ5X
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    CURRENT_PROJECT_VERSION: 33
    MARKETING_VERSION: 0.2.7
    LIBRARY_SEARCH_PATHS: $(inherited) $(SRCROOT)/../build/rust-core/$(PLATFORM_NAME)
    OTHER_LDFLAGS: $(inherited) -lhard_pause_core
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  HardPause:
    type: application
    platform: macOS
    sources:
      - App
      - Core
      - ../ios/Shared/CoreBridge
      - path: ../data/adult-domains
        type: folder
        buildPhase: resources
      - ../ios/App/Theme.swift
      - ../ios/App/PauseSeed.swift
      - ../ios/App/CaretTrackingTextField.swift
      - path: ../web/mascot
        type: folder
        buildPhase: resources
      - path: ../web/mascot/first-frame.svg
        buildPhase: resources
      - path: ../ios/App/Resources/Fonts/Recursive.ttf
        buildPhase: resources
      - path: ../ios/App/Resources/Fonts/Recursive-OFL.txt
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/BlockedPage
        type: folder
        buildPhase: resources
      - path: README.md
        buildPhase: resources
      - path: ../AGENTS.md
        buildPhase: resources
    entitlements:
      path: App/HardPause.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.automation.apple-events: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hard Pause
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMultipleInstancesProhibited: true
        NSPrincipalClass: NSApplication
        NSAppleEventsUsageDescription: Hard Pause checks browser tab addresses and redirects blocked pages to a local pause page.
        SUFeedURL: https://github.com/manuel-huez/hard-pause/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_EDDSA_PUBLIC_KEY)
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: false
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/../core/rust/include/hard_pause_core.h
        PRODUCT_BUNDLE_IDENTIFIER: org.hardpause.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: HardPauseService
        embed: false
      - target: HardPauseCLI
        embed: false
      - target: HardPauseBrowserWorker
        embed: false
      - sdk: Security.framework
      - package: Sparkle
    preBuildScripts:
      - name: Build portable core
        script: '"${SRCROOT}/../scripts/build-rust-core.sh"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Bundle production service
        script: |
          resources="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          /usr/bin/install -d -m 0755 "$resources"
          /usr/bin/install -m 0755 "${SRCROOT}/scripts/install-macos-service.sh" "$resources/install-macos-service.sh"
          /usr/bin/install -m 0755 "${SRCROOT}/scripts/uninstall-macos-service.sh" "$resources/uninstall-macos-service.sh"
          /usr/bin/install -m 0755 "${SRCROOT}/scripts/service-dry-run.sh" "$resources/service-dry-run.sh"
          /usr/bin/install -m 0644 "${SRCROOT}/scripts/org.hardpause.service.plist" "$resources/org.hardpause.service.plist"
          /usr/bin/install -m 0755 "${BUILT_PRODUCTS_DIR}/hard-pause-service" "$resources/hard-pause-service"
          /usr/bin/install -m 0755 "${BUILT_PRODUCTS_DIR}/hard-pause" "$resources/hard-pause"
          /usr/bin/ditto "${BUILT_PRODUCTS_DIR}/HardPauseBrowserWorker.app" "$resources/HardPauseBrowserWorker.app"
        inputFiles:
          - $(SRCROOT)/scripts/install-macos-service.sh
          - $(SRCROOT)/scripts/uninstall-macos-service.sh
          - $(SRCROOT)/scripts/service-dry-run.sh
          - $(SRCROOT)/scripts/org.hardpause.service.plist
          - $(BUILT_PRODUCTS_DIR)/hard-pause-service
          - $(BUILT_PRODUCTS_DIR)/hard-pause
          - $(BUILT_PRODUCTS_DIR)/HardPauseBrowserWorker.app
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/install-macos-service.sh
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/uninstall-macos-service.sh
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/service-dry-run.sh
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/org.hardpause.service.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/hard-pause-service
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/hard-pause
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/HardPauseBrowserWorker.app
  HardPauseBrowserWorker:
    type: application
    platform: macOS
    sources:
      - BrowserWorker
      - Core
      - ../ios/Shared/CoreBridge
      - App/BrowserWorkerIPC.swift
      - App/BrowserWorkerClient.swift
      - App/BrowserProtection.swift
      - App/FirefoxBrowserProtection.swift
      - App/LocalPausePageServer.swift
      - App/AdultWebsiteDatabase.swift
      - App/AdultRatingStore.swift
      - App/ProtectedServiceClient.swift
      - App/SetupReadiness.swift
      - path: ../data/adult-domains
        type: folder
        buildPhase: resources
      - path: ../web/mascot
        type: folder
        buildPhase: resources
      - path: ../ios/App/Resources/Fonts/Recursive.ttf
        buildPhase: resources
      - path: Resources/BlockedPage
        type: folder
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: App/HardPause.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.automation.apple-events: true
    info:
      path: BrowserWorker/Info.plist
      properties:
        CFBundleDisplayName: Hard Pause Browser Worker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSAppleEventsUsageDescription: Hard Pause Browser Worker checks browser tabs and redirects blocked pages.
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/../core/rust/include/hard_pause_core.h
        PRODUCT_BUNDLE_IDENTIFIER: org.hardpause.browser-worker
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - sdk: Security.framework
    preBuildScripts:
      - name: Build portable core
        script: '"${SRCROOT}/../scripts/build-rust-core.sh"'
        basedOnDependencyAnalysis: false
  HardPauseService:
    type: tool
    platform: macOS
    productName: hard-pause-service
    sources:
      - Service
      - Core
      - ../ios/Shared/CoreBridge
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Service/SystemKeychainBridge.h
        PRODUCT_NAME: hard-pause-service
        PRODUCT_BUNDLE_IDENTIFIER: hard-pause-service
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - sdk: Security.framework
      - sdk: libbsm.tbd
    preBuildScripts:
      - name: Build portable core
        script: '"${SRCROOT}/../scripts/build-rust-core.sh"'
        basedOnDependencyAnalysis: false
  HardPauseCLI:
    type: tool
    platform: macOS
    productName: hard-pause
    sources:
      - CLI
      - Core
      - ../ios/Shared/CoreBridge
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/../core/rust/include/hard_pause_core.h
        PRODUCT_NAME: hard-pause
        PRODUCT_BUNDLE_IDENTIFIER: hard-pause
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_HARDENED_RUNTIME: YES
    preBuildScripts:
      - name: Build portable core
        script: '"${SRCROOT}/../scripts/build-rust-core.sh"'
        basedOnDependencyAnalysis: false
  HardPauseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Core
      - ../ios/Shared/CoreBridge
      - App/AppModel.swift
      - App/AppleProtectionModel.swift
      - App/AppleScreenTimeAutomation.swift
      - App/SetupReadiness.swift
      - App/ServiceInstaller.swift
      - App/AdultRatingStore.swift
      - App/AdultWebsiteDatabase.swift
      - App/BrowserProtection.swift
      - App/LocalPausePageServer.swift
      - App/FirefoxBrowserProtection.swift
      - App/ProtectedServiceClient.swift
      - App/BrowserWorkerIPC.swift
      - App/BrowserWorkerClient.swift
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/../core/rust/include/hard_pause_core.h
        PRODUCT_BUNDLE_IDENTIFIER: org.hardpause.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - sdk: Security.framework
    preBuildScripts:
      - name: Build portable core
        script: '"${SRCROOT}/../scripts/build-rust-core.sh"'
        basedOnDependencyAnalysis: false
  HardPauseServiceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Service
        excludes:
          - main.swift
      - Core
      - ../ios/Shared/CoreBridge
      - ServiceTests
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Service/SystemKeychainBridge.h
        PRODUCT_BUNDLE_IDENTIFIER: org.hardpause.service-tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - sdk: Security.framework
      - sdk: libbsm.tbd
    preBuildScripts:
      - name: Build portable core
        script: '"${SRCROOT}/../scripts/build-rust-core.sh"'
        basedOnDependencyAnalysis: false
schemes:
  HardPause:
    build:
      targets:
        HardPause: all
        HardPauseService: all
        HardPauseCLI: all
        HardPauseBrowserWorker: all
        HardPauseTests: [test]
        HardPauseServiceTests: [test]
    test:
      targets:
        - HardPauseTests
        - HardPauseServiceTests
